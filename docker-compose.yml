services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      CUTOFF_TIME: "${CUTOFF_TIME:-09:00}"
      DATA_DIR: /data
    volumes:
      - foresure-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: dockerfile
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  foresure-data:
